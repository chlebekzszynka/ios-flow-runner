[project]
name = "ios-flow-runner"
version = "1.0"
description = "Framework do sterowania aplikacjami iOS przez Appium; ścieżka i lokatory w pliku JSON"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["Appium-Python-Client>=6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
