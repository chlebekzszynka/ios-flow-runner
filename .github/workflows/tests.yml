name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Testy działają na zapisanych drzewach XML — nie potrzebują macOS,
    # symulatora ani serwera Appium.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: ruff check
        run: ruff check .

      - name: pytest
        run: pytest -v
